upstream philosophy_api {
    server 127.0.0.1:3001;
}

upstream philosophy_admin {
    server 127.0.0.1:8081;
}

# HTTP：ACME 验证 + 跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name www.luca0527.art luca0527.art;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.luca0527.art$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.luca0527.art;

    ssl_certificate     /etc/letsencrypt/live/www.luca0527.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.luca0527.art/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://philosophy_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://philosophy_api/uploads/;
        proxy_set_header Host $host;
    }

    location /admin/ {
        proxy_pass http://philosophy_admin/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        return 301 /admin/;
    }

    location = /app {
        return 301 /app/;
    }

    location /app/ {
        alias /opt/philosophy/h5/;
        index index.html;
    }

    location = / {
        return 302 /admin/;
    }
}

# luca0527.art 跳转到 www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name luca0527.art;

    ssl_certificate     /etc/letsencrypt/live/www.luca0527.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.luca0527.art/privkey.pem;

    return 301 https://www.luca0527.art$request_uri;
}
